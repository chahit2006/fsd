spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

server:
  port: 0

loyalty:
  points:
    earn-rate: 1
    earn-per-amount: 10
    redeem-conversion: 1.0
    max-redeem-percentage: 50
    expiry-days: 365
  scheduler:
    expiry-cron: "0 0 0 31 2 ?"
